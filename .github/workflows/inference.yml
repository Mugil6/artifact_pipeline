name: Full CI Pipeline

on:
  push:
    branches: [ inference ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run tests
      run: PYTHONPATH=. pytest tests

  train:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Train model
      run: PYTHONPATH=. python src/train.py
    - name: Upload model
      uses: actions/upload-artifact@v4
      with:
        name: model
        path: model_train.pkl

  inference:
    needs: train
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Download model
      uses: actions/download-artifact@v4
      with:
        name: model
        path: .
    - name: Run inference
      run: PYTHONPATH=. python src/inference.py

